# ================================
# Production Docker Compose
# ================================
# Features: Health checks, restart policies, logging, secrets

version: '3.9'

services:
  # ================================
  # PostgreSQL (Production)
  # ================================
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-myapp_prod}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    
    secrets:
      - db_password
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - backend
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================
  # Backend (Production)
  # ================================
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/username/myapp/backend:main}
    restart: unless-stopped
    
    depends_on:
      postgres:
        condition: service_healthy
    
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-myapp_prod}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      LOG_LEVEL: info
      LOG_PRETTY: "false"
    
    secrets:
      - db_password
      - jwt_secret
    
    ports:
      - "3000:3000"
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - backend
      - frontend
    
    # Deployment config
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================
  # Frontend (Production)
  # ================================
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/username/myapp/frontend:main}
    restart: unless-stopped
    
    depends_on:
      backend:
        condition: service_healthy
    
    ports:
      - "80:80"
      - "443:443"
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    
    networks:
      - frontend
    
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 0
        order: stop-first
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ================================
# Networks
# ================================
networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

# ================================
# Volumes
# ================================
volumes:
  postgres_data:
    driver: local

# ================================
# Secrets (file-based для Docker Compose)
# ================================
secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
