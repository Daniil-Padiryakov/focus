# ================================
# Auto Label Workflow
# ================================
# Automatically adds labels to PRs based on:
# - Changed files
# - Branch name
# - PR size

name: Auto Label

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

jobs:
  auto-label:
    name: Add Labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Label based on branch name
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const labels = [];

            // Map branch prefixes to labels
            const branchLabels = {
              'feature/': 'feature',
              'fix/': 'bug',
              'hotfix/': 'hotfix',
              'refactor/': 'refactoring',
              'chore/': 'maintenance',
              'docs/': 'documentation',
              'test/': 'testing',
              'perf/': 'performance'
            };

            // Add label based on branch prefix
            for (const [prefix, label] of Object.entries(branchLabels)) {
              if (branch.startsWith(prefix)) {
                labels.push(label);
                break;
              }
            }

            // Add labels if any found
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labels
              });

              console.log(`Added labels: ${labels.join(', ')}`);
            }

      - name: Label based on changed files
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const labels = new Set();

            // Analyze changed files
            for (const file of files) {
              const path = file.filename;

              // Backend changes
              if (path.includes('apps/backend/')) {
                labels.add('backend');
              }

              // Frontend changes
              if (path.includes('apps/frontend/')) {
                labels.add('frontend');
              }

              // Shared package changes
              if (path.includes('packages/shared/')) {
                labels.add('shared');
              }

              // Database changes
              if (path.includes('migrations/') || path.includes('seeds/')) {
                labels.add('database');
              }

              // Docker changes
              if (path.includes('Dockerfile') || path.includes('docker-compose')) {
                labels.add('docker');
              }

              // CI/CD changes
              if (path.includes('.github/workflows/')) {
                labels.add('ci-cd');
              }

              // Documentation changes
              if (path.endsWith('.md') || path.includes('docs/')) {
                labels.add('documentation');
              }

              // Configuration changes
              if (path.includes('package.json') ||
                  path.includes('tsconfig') ||
                  path.includes('.eslintrc') ||
                  path.includes('.prettierrc')) {
                labels.add('configuration');
              }
            }

            // Add labels
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: Array.from(labels)
              });

              console.log(`Added labels: ${Array.from(labels).join(', ')}`);
            }

      - name: Label based on PR size
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            // Calculate total changes
            let additions = 0;
            let deletions = 0;

            for (const file of files) {
              additions += file.additions;
              deletions += file.deletions;
            }

            const total = additions + deletions;
            let sizeLabel = '';

            // Determine size label
            if (total < 50) {
              sizeLabel = 'size/XS';
            } else if (total < 200) {
              sizeLabel = 'size/S';
            } else if (total < 500) {
              sizeLabel = 'size/M';
            } else if (total < 1000) {
              sizeLabel = 'size/L';
            } else {
              sizeLabel = 'size/XL';
            }

            // Remove old size labels
            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            for (const label of currentLabels) {
              if (label.name.startsWith('size/')) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  name: label.name
                });
              }
            }

            // Add new size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [sizeLabel]
            });

            console.log(`Added size label: ${sizeLabel} (${total} lines changed)`);
