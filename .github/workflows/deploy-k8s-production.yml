# ================================
# Deploy to Kubernetes (Production)
# ================================
# Triggers: Push to main branch (requires approval)
# Target: Kubernetes production cluster

name: Deploy to K8s Production

on:
  # Trigger after Docker Build completes successfully
  workflow_run:
    workflows: ["Docker Build"]
    types:
      - completed
    branches:
      - main
  # Allow manual trigger
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: main

jobs:
  deploy:
    name: Deploy to Production Cluster
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run if Docker Build was successful
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    environment:
      name: production
      url: https://focus-app.ru

    steps:
      # ================================
      # Pre-flight check
      # ================================
      - name: Check Docker Build status
        if: github.event_name == 'workflow_run'
        run: |
          echo "🔍 Docker Build workflow result: ${{ github.event.workflow_run.conclusion }}"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ Docker Build failed or was cancelled"
            echo "Deployment aborted"
            exit 1
          fi
          echo "✅ Docker Build successful, proceeding with deployment"

      # ================================
      # Checkout
      # ================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ================================
      # Pre-deployment checks
      # ================================
      - name: Verify images exist
        run: |
          echo "🔍 Verifying Docker images in registry..."

          BACKEND_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_TAG }}"
          FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}"

          echo "Checking backend image: $BACKEND_IMAGE"
          if docker manifest inspect $BACKEND_IMAGE > /dev/null 2>&1; then
            echo "✅ Backend image exists"
          else
            echo "❌ Backend image NOT found: $BACKEND_IMAGE"
            echo ""
            echo "⚠️ This image needs to be built first!"
            echo "Make sure the docker-build workflow has run successfully."
            exit 1
          fi

          echo ""
          echo "Checking frontend image: $FRONTEND_IMAGE"
          if docker manifest inspect $FRONTEND_IMAGE > /dev/null 2>&1; then
            echo "✅ Frontend image exists"
          else
            echo "❌ Frontend image NOT found: $FRONTEND_IMAGE"
            echo ""
            echo "⚠️ This image needs to be built first!"
            echo "Make sure the docker-build workflow has run successfully."
            exit 1
          fi

          echo ""
          echo "✅ All required images exist in registry"

      # ================================
      # Setup Kubernetes
      # ================================
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster access
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ================================
      # Backup
      # ================================
      - name: Create database backup
        run: |
          # Get postgres pod
          POSTGRES_POD=$(kubectl get pod -n focus -l app=postgres -o jsonpath='{.items[0].metadata.name}')

          # Create backup
          timestamp=$(date +%Y%m%d_%H%M%S)
          kubectl exec -n focus $POSTGRES_POD -- pg_dump -U postgres focus_prod | gzip > backup_$timestamp.sql.gz

          echo "✅ Backup created: backup_$timestamp.sql.gz"

          # Upload to artifacts (optional: upload to S3/GCS instead)
          mkdir -p backups
          mv backup_$timestamp.sql.gz backups/

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.sha }}
          path: backups/
          retention-days: 7

      # ================================
      # Deploy
      # ================================
      - name: Deploy to Kubernetes
        run: |
          echo "🚀 Deploying to production cluster..."

          # Apply manifests using Kustomize
          # -k flag uses kustomization.yaml to manage resources
          kubectl apply -k k8s/base/

          echo "✅ Manifests applied"

      # ================================
      # Wait for rollout
      # ================================
      - name: Monitor backend rollout
        run: |
          echo "⏳ Monitoring backend rollout..."
          kubectl rollout status deployment/backend -n focus --timeout=5m

      - name: Monitor frontend rollout
        run: |
          echo "⏳ Monitoring frontend rollout..."
          kubectl rollout status deployment/frontend -n focus --timeout=3m

      # ================================
      # Post-deployment
      # ================================
      - name: Run database migrations
        run: |
          # Wait for backend to be ready
          kubectl wait --for=condition=ready pod -l app=backend -n focus --timeout=120s

          # Get backend pod
          BACKEND_POD=$(kubectl get pod -n focus -l app=backend -o jsonpath='{.items[0].metadata.name}')

          # Run migrations
          kubectl exec -n focus $BACKEND_POD -- pnpm --filter @focus/backend db:migrate

      - name: Comprehensive health checks
        run: |
          echo "Running health checks..."

          # Check all pods are ready
          kubectl wait --for=condition=ready pod -l app=backend -n focus --timeout=60s
          kubectl wait --for=condition=ready pod -l app=frontend -n focus --timeout=60s
          kubectl wait --for=condition=ready pod -l app=postgres -n focus --timeout=60s

          # Test backend health endpoint (via port-forward)
          kubectl port-forward -n focus svc/backend 3000:3000 &
          PF_PID=$!
          sleep 5

          for i in {1..5}; do
            if curl -f http://localhost:3000/health; then
              echo "✅ Backend health check $i/5 passed"
            else
              echo "❌ Backend health check $i/5 failed"
              kill $PF_PID
              exit 1
            fi
            sleep 5
          done

          kill $PF_PID
          echo "✅ All health checks passed"

      - name: Verify deployment
        run: |
          echo "📊 Deployment status:"
          kubectl get pods -n focus -o wide
          kubectl get svc -n focus
          kubectl get ingress -n focus

      # ================================
      # Debug on failure
      # ================================
      - name: Debug deployment failure
        if: failure()
        run: |
          echo "🔍 Debugging deployment failure..."
          echo ""

          echo "📊 Pods status:"
          kubectl get pods -n focus -o wide
          echo ""

          echo "📋 Backend deployment details:"
          kubectl describe deployment backend -n focus || true
          echo ""

          echo "📋 Backend pods details:"
          kubectl describe pods -n focus -l app=backend || true
          echo ""

          echo "📝 Backend pod logs (init container - migrations):"
          BACKEND_POD=$(kubectl get pod -n focus -l app=backend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ ! -z "$BACKEND_POD" ]; then
            echo "Init container logs:"
            kubectl logs $BACKEND_POD -n focus -c run-migrations --tail=50 || echo "No init container logs"
            echo ""
            echo "Main container logs:"
            kubectl logs $BACKEND_POD -n focus -c backend --tail=100 || echo "No main container logs yet"
          else
            echo "⚠️ No backend pod found"
          fi
          echo ""

          echo "📋 Frontend pod logs:"
          FRONTEND_POD=$(kubectl get pod -n focus -l app=frontend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ ! -z "$FRONTEND_POD" ]; then
            kubectl logs $FRONTEND_POD -n focus --tail=50 || echo "No frontend logs"
          fi
          echo ""

          echo "📋 Postgres pod logs:"
          POSTGRES_POD=$(kubectl get pod -n focus -l app=postgres -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ ! -z "$POSTGRES_POD" ]; then
            kubectl logs $POSTGRES_POD -n focus --tail=50 || echo "No postgres logs"
          fi
          echo ""

          echo "🎯 Recent events:"
          kubectl get events -n focus --sort-by='.lastTimestamp' --field-selector type!=Normal | tail -30
          echo ""

          echo "🔗 Services and endpoints:"
          kubectl get svc -n focus
          kubectl get endpoints -n focus

      # ================================
      # Rollback on failure
      # ================================
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed, attempting rollback..."

          # Check if rollout history exists for backend
          if kubectl rollout history deployment/backend -n focus &>/dev/null; then
            echo "📜 Backend rollout history found, rolling back..."
            kubectl rollout undo deployment/backend -n focus
            kubectl rollout status deployment/backend -n focus --timeout=5m || echo "⚠️ Backend rollback status unknown"
          else
            echo "⚠️ No rollout history for backend (first deployment?)"
            echo "Deployment will remain in current state"
          fi

          # Check if rollout history exists for frontend
          if kubectl rollout history deployment/frontend -n focus &>/dev/null; then
            echo "📜 Frontend rollout history found, rolling back..."
            kubectl rollout undo deployment/frontend -n focus
            kubectl rollout status deployment/frontend -n focus --timeout=3m || echo "⚠️ Frontend rollback status unknown"
          else
            echo "⚠️ No rollout history for frontend (first deployment?)"
          fi

          echo ""
          echo "ℹ️ Database backup available in artifacts for manual recovery if needed"

      # ================================
      # Cleanup
      # ================================
      - name: Cleanup old images
        if: success()
        run: |
          echo "Cleanup completed via image retention policies"
          # Note: Configure image retention in GHCR settings
