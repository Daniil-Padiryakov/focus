# ================================
# Deploy to Staging
# ================================
# Triggers: Push to develop branch
# Environment: staging

name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # Manual trigger

# Environment protection rules
environment:
  name: staging
  url: https://staging.yourdomain.com

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      # ================================
      # Checkout
      # ================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ================================
      # Setup SSH
      # ================================
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      # ================================
      # Prepare deployment files
      # ================================
      - name: Create deployment directory
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "mkdir -p ~/myapp"

      - name: Copy docker-compose files
        run: |
          scp docker-compose.yml docker-compose.prod.yml \
            ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:~/myapp/

      # ================================
      # Deploy
      # ================================
      - name: Pull latest images
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            cd ~/myapp
          
            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
            # Pull images
            docker pull ghcr.io/${{ github.repository }}/backend:develop
            docker pull ghcr.io/${{ github.repository }}/frontend:develop
          ENDSSH

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            cd ~/myapp
          
            # Set environment variables
            export BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend:develop
            export FRONTEND_IMAGE=ghcr.io/${{ github.repository }}/frontend:develop
            export DATABASE_NAME=myapp_staging
          
            # Deploy with zero-downtime
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
          
            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            sleep 10
          
            # Check health
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          ENDSSH

      # ================================
      # Post-deployment checks
      # ================================
      - name: Run database migrations
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            cd ~/myapp
            docker compose exec -T backend pnpm --filter @my-app/backend migration:run
          ENDSSH

      - name: Health check
        run: |
          # Wait for health endpoint
          max_attempts=30
          attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if curl -f https://staging-api.yourdomain.com/health; then
              echo "✅ Health check passed"
              exit 0
            fi
          
            echo "⏳ Waiting for health check (attempt $((attempt + 1))/$max_attempts)..."
            sleep 10
            attempt=$((attempt + 1))
          done
          
          echo "❌ Health check failed"
          exit 1

      - name: Verify deployment
        run: |
          echo "Deployment verification:"
          curl -s https://staging-api.yourdomain.com/health | jq '.'

      # ================================
      # Cleanup
      # ================================
      - name: Cleanup old images
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'ENDSSH'
            # Remove dangling images
            docker image prune -f
          ENDSSH

      # ================================
      # Notifications
      # ================================
      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Staging Deployment: ${{ job.status }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            URL: https://staging.yourdomain.com
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true