# ================================
# Docker Build & Push Workflow
# ================================
# Triggers: Push to main/develop
# Features: Multi-platform, BuildKit caching, semantic versioning

name: Docker Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'

# Permissions для pushing к GitHub Container Registry
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ================================
  # Build and Push Backend
  # ================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    
    steps:
      # ================================
      # Checkout
      # ================================
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ================================
      # Docker Setup
      # ================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # ================================
      # Login to GitHub Container Registry
      # ================================
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # ================================
      # Extract metadata (tags, labels)
      # ================================
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      
      # ================================
      # Build and Push
      # ================================
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          target: production
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      # ================================
      # Output image details
      # ================================
      - name: Image details
        run: |
          echo "Backend image built and pushed:"
          echo "${{ steps.meta.outputs.tags }}"

  # ================================
  # Build and Push Frontend
  # ================================
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          target: production
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            VITE_API_URL=${{ github.ref == 'refs/heads/main' && 'https://api.yourdomain.com' || 'https://api-test.yourdomain.com' }}

      - name: Image details
        run: |
          echo "Frontend image built and pushed:"
          echo "${{ steps.meta.outputs.tags }}"

  # ================================
  # Summary
  # ================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - name: Summary
        run: |
          echo "✅ Docker images built and pushed successfully!"
          echo ""
          echo "Images available at:"
          echo "  Backend:  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.ref_name }}"
          echo "  Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.ref_name }}"
          echo ""
          echo "Pull with:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.ref_name }}"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.ref_name }}"

  # ================================
  # Deploy to QA (develop branch only)
  # ================================
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: qa
      url: https://qa.focus-app.ru

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.QA_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Normalize image name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        run: |
          echo "🚀 Deploying to QA cluster..."
          kubectl apply -k k8s/base/
          echo "✅ Manifests applied"

      - name: Update images and force restart
        run: |
          echo "🔄 Updating images to ${{ github.ref_name }} tag..."
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}"
        
          kubectl set image deployment/backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:${{ github.ref_name }} \
            run-migrations=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:${{ github.ref_name }} \
            -n focus
        
          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend:${{ github.ref_name }} \
            -n focus
        
          echo "🔄 Force restarting deployments..."
          kubectl rollout restart deployment/backend -n focus
          kubectl rollout restart deployment/frontend -n focus
        
          echo "✅ Images updated and deployments restarted"

      - name: Check pods status before rollout
        run: |
          echo "📊 Pods status:"
          kubectl get pods -n focus -o wide
          echo ""
          echo "📋 Deployment status:"
          kubectl get deployment -n focus

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n focus --timeout=5m
          kubectl rollout status deployment/frontend -n focus --timeout=3m

      - name: Run migrations
        run: |
          POD=$(kubectl get pod -n focus -l app=backend -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n focus $POD -- pnpm --filter @focus/backend db:migrate

      - name: Verify deployment
        run: |
          kubectl wait --for=condition=ready pod -l app=backend -n focus --timeout=120s
          kubectl wait --for=condition=ready pod -l app=frontend -n focus --timeout=60s
          kubectl get pods -n focus
          echo "✅ QA deployment successful"

  # ================================
  # Deploy to Production (main branch only)
  # ================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://focus-app.ru

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Normalize image name
        run: |
          echo "IMAGE_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        run: |
          echo "🚀 Deploying to production cluster..."
          kubectl apply -k k8s/base/
          echo "✅ Manifests applied"

      - name: Update images and force restart
        run: |
          echo "🔄 Updating images to ${{ github.ref_name }} tag..."
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}"
          
          kubectl set image deployment/backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:${{ github.ref_name }} \
            run-migrations=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/backend:${{ github.ref_name }} \
            -n focus
          
          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}/frontend:${{ github.ref_name }} \
            -n focus
          
          echo "🔄 Force restarting deployments..."
          kubectl rollout restart deployment/backend -n focus
          kubectl rollout restart deployment/frontend -n focus
          
          echo "✅ Images updated and deployments restarted"

      - name: Check pods status before rollout
        run: |
          echo "📊 Pods status:"
          kubectl get pods -n focus -o wide
          echo ""
          echo "📋 Deployment status:"
          kubectl get deployment -n focus

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n focus --timeout=5m
          kubectl rollout status deployment/frontend -n focus --timeout=3m

      - name: Run migrations
        run: |
          POD=$(kubectl get pod -n focus -l app=backend -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n focus $POD -- pnpm --filter @focus/backend db:migrate

      - name: Verify deployment
        run: |
          kubectl wait --for=condition=ready pod -l app=backend -n focus --timeout=120s
          kubectl wait --for=condition=ready pod -l app=frontend -n focus --timeout=60s
          kubectl get pods -n focus
          echo "✅ Production deployment successful"
