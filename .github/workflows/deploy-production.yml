# ================================
# Deploy to Production
# ================================
# Triggers: Push to main branch (after approval)
# Environment: production

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual trigger with approval

# Require approval before production deploy
environment:
  name: production
  url: https://yourdomain.com

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # Add timeout для safety
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ================================
      # Pre-deployment checks
      # ================================
      - name: Verify images exist
        run: |
          # Check that images were built for this commit
          docker manifest inspect ghcr.io/${{ github.repository }}/backend:main-${{ github.sha }}
          docker manifest inspect ghcr.io/${{ github.repository }}/frontend:main-${{ github.sha }}

      # ================================
      # Setup SSH
      # ================================
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      # ================================
      # Backup before deploy
      # ================================
      - name: Create database backup
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            cd ~/myapp
          
            # Create backup
            timestamp=$(date +%Y%m%d_%H%M%S)
            docker compose exec -T postgres pg_dump -U postgres myapp_prod | gzip > backups/backup_$timestamp.sql.gz
          
            echo "✅ Backup created: backup_$timestamp.sql.gz"
          ENDSSH

      # ================================
      # Deploy
      # ================================
      - name: Copy deployment files
        run: |
          scp docker-compose.yml docker-compose.prod.yml \
            ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:~/myapp/

      - name: Pull latest images
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            cd ~/myapp
          
            # Login to registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
            # Pull specific commit images
            docker pull ghcr.io/${{ github.repository }}/backend:main-${{ github.sha }}
            docker pull ghcr.io/${{ github.repository }}/frontend:main-${{ github.sha }}
          
            # Tag as main
            docker tag ghcr.io/${{ github.repository }}/backend:main-${{ github.sha }} \
                       ghcr.io/${{ github.repository }}/backend:main
            docker tag ghcr.io/${{ github.repository }}/frontend:main-${{ github.sha }} \
                       ghcr.io/${{ github.repository }}/frontend:main
          ENDSSH

      - name: Deploy with zero-downtime rolling update
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            cd ~/myapp
          
            export BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend:main
            export FRONTEND_IMAGE=ghcr.io/${{ github.repository }}/frontend:main
            export DATABASE_NAME=myapp_prod
          
            # Rolling update
            echo "🚀 Starting rolling update..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --remove-orphans
          
            # Monitor rollout
            echo "⏳ Monitoring rollout..."
            sleep 60  # Wait for update_config.monitor duration
          
            # Verify all healthy
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          ENDSSH

      # ================================
      # Post-deployment
      # ================================
      - name: Run database migrations
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            cd ~/myapp
            docker compose exec -T backend pnpm --filter @my-app/backend migration:run
          ENDSSH

      - name: Comprehensive health checks
        run: |
          echo "Running health checks..."
          
          # Check backend health
          for i in {1..5}; do
            if curl -f https://api.yourdomain.com/health; then
              echo "✅ Backend health check $i/5 passed"
            else
              echo "❌ Backend health check $i/5 failed"
              exit 1
            fi
            sleep 5
          done
          
          # Check frontend
          if curl -f https://yourdomain.com; then
            echo "✅ Frontend is accessible"
          else
            echo "❌ Frontend is not accessible"
            exit 1
          fi
          
          echo "✅ All health checks passed"

      # ================================
      # Rollback on failure
      # ================================
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed, rolling back..."
          
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            cd ~/myapp
          
            # Rollback to previous version
            docker compose -f docker-compose.yml -f docker-compose.prod.yml rollback
          
            echo "✅ Rollback completed"
          ENDSSH

      # ================================
      # Notifications
      # ================================
      - name: Notify team
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🚀 Production Deployment: ${{ job.status }}
            
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Message: ${{ github.event.head_commit.message }}
            
            URL: https://yourdomain.com
            
            ${{ job.status == 'success' && '✅ Deployment successful!' || '❌ Deployment failed - rollback initiated' }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

      # ================================
      # Cleanup
      # ================================
      - name: Cleanup old images
        if: success()
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            # Keep last 3 versions
            docker images | grep ghcr.io | tail -n +4 | awk '{print $3}' | xargs -r docker rmi
          
            # Prune dangling
            docker image prune -f
          ENDSSH