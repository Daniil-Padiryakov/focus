name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: '[Feature]: '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: I'm frustrated when... / Users need to be able to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: Add a button that allows user to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative solutions?
      placeholder: Instead of a button, we could use...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical (business blocking)
        - High (important for user)
        - Medium (nice to have)
        - Low (future enhancement)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the application?
      options:
        - Backend API
        - Frontend UI
        - Database
        - Authentication
        - Docker/Infrastructure
        - CI/CD
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What defines "done" for this feature?
      placeholder: |
        - [ ] User can click the button
        - [ ] Button triggers the action
        - [ ] Success message is shown
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups/Examples
      description: Any mockups, wireframes, or examples from other apps?
      placeholder: |
        ![mockup](url)
        Similar to how Todoist does it: [link]

  - type: textarea
    id: technical
    attributes:
      label: Technical Considerations
      description: Any technical details, concerns, or constraints?
      placeholder: |
        - This will require a new database table
        - Needs to handle concurrent requests
        - Should work offline

  - type: checkboxes
    id: impact
    attributes:
      label: Impact Areas
      description: Which areas might be affected?
      options:
        - label: Database schema changes
        - label: API breaking changes
        - label: UI/UX changes
        - label: Performance impact
        - label: Security considerations
        - label: Third-party integrations

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information about the feature request
      placeholder: This feature is requested by...
