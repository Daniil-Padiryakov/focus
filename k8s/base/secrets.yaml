# ================================
# Kubernetes Secrets
# ================================
# IMPORTANT: This is a TEMPLATE file.
#
# DO NOT commit actual secrets to git!
#
# Usage:
# 1. Copy this file: cp secrets.yaml secrets.local.yaml
# 2. Add secrets.local.yaml to .gitignore
# 3. Replace <base64-encoded-value> with actual values
# 4. Apply: kubectl apply -f secrets.local.yaml
#
# To encode values:
# echo -n "your-secret-value" | base64
#
# Example:
# echo -n "postgres" | base64
# => cG9zdGdyZXM=

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: focus
  labels:
    app: postgres
type: Opaque
data:
  # PostgreSQL credentials (base64 encoded)
  # Default: "postgres" / "postgres" (for testing only!)
  username: cG9zdGdyZXM=
  password: cG9zdGdyZXM=

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: focus
  labels:
    app: focus
type: Opaque
data:
  # JWT secret (base64 encoded, min 32 chars)
  # Default: "dev-jwt-secret-for-local-testing-only-min-32-chars"
  jwt_secret: ZGV2LWp3dC1zZWNyZXQtZm9yLWxvY2FsLXRlc3Rpbmctb25seS1taW4tMzItY2hhcnM=
